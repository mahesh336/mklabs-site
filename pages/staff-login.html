<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | MK LABS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top,
                    #231942 0%,
                    #090b18 45%,
                    #04050c 100%
                );

            color: white;

            overflow: hidden;
        }

        /* Background stars */

        body::before {

            content: "";

            position: fixed;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            background-image:
                radial-gradient(
                    white 1px,
                    transparent 1px
                );

            background-size: 60px 60px;

            opacity: .12;

            pointer-events: none;
        }

        /* Back button */

        .back-button {

            position: fixed;

            top: 25px;
            left: 30px;

            color: rgba(255,255,255,.7);

            text-decoration: none;

            font-size: 15px;

            transition: .3s;
        }

        .back-button:hover {

            color: #8B5CF6;

        }

        /* Login container */

        .login-container {

            width: 100%;
            max-width: 440px;

            padding: 20px;

            position: relative;

            z-index: 2;
        }

        /* Logo */

        .logo {

            text-align: center;

            font-size: 34px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .logo span {

            color: #8B5CF6;

        }

        .portal-title {

            text-align: center;

            color: #aaa;

            font-size: 14px;

            letter-spacing: 4px;

            margin-bottom: 30px;
        }

        /* Glass card */

        .login-card {

            padding: 40px 35px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid rgba(255,255,255,.14);

            border-radius: 24px;

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 25px 70px rgba(0,0,0,.45);
        }

        .login-card h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }

        .login-card .subtitle {

            text-align: center;

            color: #999;

            font-size: 15px;

            margin-bottom: 30px;
        }

        /* Form */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #ccc;
        }

        .form-group input {

            width: 100%;

            padding: 15px 16px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,.12);

            outline: none;

            background:
                rgba(0,0,0,.25);

            color: white;

            font-size: 15px;

            transition: .3s;
        }

        .form-group input:focus {

            border-color: #8B5CF6;

            box-shadow:
                0 0 20px rgba(139,92,246,.15);
        }

        .form-group input::placeholder {

            color: #777;
        }

        /* Login button */

        .login-button {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #8B5CF6;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: .3s;
        }

        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(139,92,246,.35);
        }

        /* Security text */

        .security-note {

            text-align: center;

            margin-top: 25px;

            color: #666;

            font-size: 12px;
        }

        /* Mobile */

        @media(max-width: 500px) {

            .login-container {

                padding: 18px;

            }

            .login-card {

                padding: 30px 22px;

            }

            .logo {

                font-size: 28px;

            }

            .back-button {

                left: 20px;
                top: 20px;

            }

        }

    </style>

</head>


<body>

    <a href="../index.html" class="back-button">
        ← Back to MK LABS
    </a>


    <main class="login-container">

        <div class="logo">
            MK <span>LABS</span>
        </div>

        <div class="portal-title">
            STAFF PORTAL
        </div>


        <div class="login-card">

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Sign in to access the staff dashboard.
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Staff Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="staff@mklabs.co.in"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>

            </form>


            <p class="security-note">
                🔒 Authorized MK LABS personnel only
            </p>

        </div>

    </main>

</body>

</html>
