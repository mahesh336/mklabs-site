<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MK LABS | Developer Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

/* ==========================================
   RESET
   ========================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

    font-family: 'Space Grotesk', sans-serif;

}


/* ==========================================
   BODY
   ========================================== */

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at top,
            #231942 0%,
            #090b18 45%,
            #04050c 100%
        );

    color: white;

    overflow: hidden;

}


/* ==========================================
   BACKGROUND STARS
   ========================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size: 60px 60px;

    opacity: .12;

    pointer-events: none;

}


/* ==========================================
   LOGIN CONTAINER
   ========================================== */

.login-container {

    position: relative;

    width: min(92%, 450px);

    padding: 45px 38px;

    background: rgba(255, 255, 255, 0.07);

    border: 1px solid rgba(255, 255, 255, 0.15);

    border-radius: 25px;

    backdrop-filter: blur(25px);

    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0, 0, 0, .45);

    z-index: 2;

}


/* ==========================================
   LOGO
   ========================================== */

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: 700;

    margin-bottom: 10px;

}

.logo span {

    color: #8B5CF6;

}


/* ==========================================
   SUBTITLE
   ========================================== */

.subtitle {

    text-align: center;

    color: rgba(255, 255, 255, .6);

    margin-bottom: 35px;

    font-size: 15px;

}


/* ==========================================
   HEADING
   ========================================== */

h1 {

    text-align: center;

    font-size: 28px;

    margin-bottom: 30px;

}


/* ==========================================
   LABELS
   ========================================== */

label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    color: rgba(255, 255, 255, .75);

}


/* ==========================================
   INPUTS
   ========================================== */

input {

    width: 100%;

    padding: 15px 16px;

    margin-bottom: 20px;

    border-radius: 12px;

    border: 1px solid rgba(255, 255, 255, .15);

    background: rgba(0, 0, 0, .25);

    color: white;

    outline: none;

    font-size: 15px;

    transition: .25s;

}

input:focus {

    border-color: #8B5CF6;

    box-shadow:
        0 0 20px rgba(139, 92, 246, .2);

}

input::placeholder {

    color: rgba(255, 255, 255, .35);

}


/* ==========================================
   FORGOT PASSWORD
   ========================================== */

.forgot-wrapper {

    text-align: right;

    margin-top: -10px;

    margin-bottom: 18px;

}

.forgot-link {

    color: #8B5CF6;

    text-decoration: none;

    font-size: 13px;

    cursor: pointer;

    transition: .2s;

}

.forgot-link:hover {

    color: #a78bfa;

    text-decoration: underline;

}


/* ==========================================
   LOGIN BUTTON
   ========================================== */

.login-btn {

    width: 100%;

    padding: 15px;

    margin-top: 5px;

    border: none;

    border-radius: 50px;

    background: #8B5CF6;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: .3s;

}

.login-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 0 30px rgba(139, 92, 246, .5);

}

.login-btn:disabled {

    opacity: .6;

    cursor: not-allowed;

    transform: none;

    box-shadow: none;

}


/* ==========================================
   STATUS MESSAGE
   ========================================== */

#message {

    min-height: 24px;

    margin-top: 18px;

    text-align: center;

    font-size: 14px;

    color: rgba(255, 255, 255, .7);

}


/* ==========================================
   BACK LINK
   ========================================== */

.back-link {

    display: block;

    margin-top: 25px;

    text-align: center;

    color: rgba(255, 255, 255, .5);

    text-decoration: none;

    font-size: 14px;

    transition: .2s;

}

.back-link:hover {

    color: #8B5CF6;

}


/* ==========================================
   MOBILE
   ========================================== */

@media (max-width: 500px) {

    .login-container {

        padding: 35px 25px;

    }

    .logo {

        font-size: 26px;

    }

    h1 {

        font-size: 24px;

    }

}

</style>

</head>


<body>


<div class="login-container">


    <!-- =====================================
         LOGO
         ===================================== -->

    <div class="logo">

        MK <span>LABS</span>

    </div>


    <p class="subtitle">

        Secure Developer Access

    </p>


    <h1>

        Sign in to Console

    </h1>


    <!-- =====================================
         LOGIN FORM
         ===================================== -->

    <form id="loginForm">


        <!-- EMAIL -->

        <label for="email">

            Email

        </label>


        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <!-- PASSWORD -->

        <label for="password">

            Password

        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <!-- FORGOT PASSWORD -->

        <div class="forgot-wrapper">

            <a
                href="#"
                id="forgotPassword"
                class="forgot-link"
            >

                Forgot password?

            </a>

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="login-btn"
            id="loginButton"
        >

            Enter Console →

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


    </form>


    <!-- =====================================
         BACK TO WEBSITE
         ===================================== -->

    <a
        href="../index.html"
        class="back-link"
    >

        ← Back to MK LABS

    </a>


</div>



<!-- ==========================================
     SUPABASE
     ========================================== -->

<script type="module">


import {

    createClient

}

from

"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";



/* ==========================================
   SUPABASE CONFIGURATION
   ========================================== */

const SUPABASE_URL =

    "https://ffxubvsodumbicbkjbhu.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =

    "sb_publishable_Uh2voMc6uTYeCX_k0hD0Sw_AMj-rNSv";



const supabase =

    createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



/* ==========================================
   ELEMENTS
   ========================================== */

const loginForm =

    document.getElementById("loginForm");


const loginButton =

    document.getElementById("loginButton");


const forgotPassword =

    document.getElementById("forgotPassword");


const message =

    document.getElementById("message");



/* ==========================================
   LOGIN
   ========================================== */

loginForm.addEventListener(

    "submit",

    async (event) => {


        event.preventDefault();


        const email =

            document
                .getElementById("email")
                .value
                .trim();


        const password =

            document
                .getElementById("password")
                .value;



        /* Disable button */

        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";

        message.textContent = "";



        try {


            /* ==================================
               SIGN IN
               ================================== */

            const {

                data,
                error

            } =

                await supabase.auth.signInWithPassword({

                    email: email,

                    password: password

                });



            if (error) {

                throw error;

            }



            if (!data.user) {

                throw new Error(

                    "Login failed. Please try again."

                );

            }



            /* ==================================
               GET USER PROFILE
               ================================== */

            const {

                data: profile,
                error: profileError

            } =

                await supabase

                    .from("profiles")

                    .select("full_name, role")

                    .eq("id", data.user.id)

                    .single();



            if (profileError) {

                 console.error("PROFILE ERROR:", profileError);


                 await supabase.auth.signOut();


                 throw new Error(

                    "Profile error: " + profileError.message

                );

            }



            /* ==================================
               CHECK ROLE
               ================================== */

            if (

                profile.role !== "admin" &&

                profile.role !== "developer"

            ) {


                await supabase.auth.signOut();


                throw new Error(

                    "Your account does not have console access."

                );

            }



            /* ==================================
               SUCCESS
               ================================== */

            message.textContent =

                "Login successful. Opening console...";


            setTimeout(() => {


                window.location.href =

                    "console.html";


            }, 700);


        }


        catch (error) {


            console.error(error);


            message.textContent =

                error.message ||

                "Unable to sign in.";


            loginButton.disabled = false;


            loginButton.textContent =

                "Enter Console →";


        }


    }

);



/* ==========================================
   FORGOT PASSWORD
   ========================================== */

forgotPassword.addEventListener(

    "click",

    async (event) => {


        event.preventDefault();



        const email =

            document
                .getElementById("email")
                .value
                .trim();



        /* ==================================
           REQUIRE EMAIL
           ================================== */

        if (!email) {


            message.textContent =

                "Enter your email address first.";


            return;

        }



        /* ==================================
           DISABLE LINK
           ================================== */

        forgotPassword.style.pointerEvents =

            "none";


        message.textContent =

            "Sending password reset email...";



        try {


            /* ==================================
               DYNAMIC RESET URL
               ==================================

               LOCAL:
               http://localhost:3000/pages/reset-password.html

               LIVE:
               https://mklabs.co.in/pages/reset-password.html

            */

            const resetUrl =

                `${window.location.origin}/pages/reset-password.html`;



            const {

                error

            } =

                await supabase.auth.resetPasswordForEmail(

                    email,

                    {

                        redirectTo: resetUrl

                    }

                );



            if (error) {

                throw error;

            }



            message.textContent =

                "Password reset email sent. Check your inbox.";


        }


        catch (error) {


            console.error(error);


            message.textContent =

                error.message ||

                "Unable to send password reset email.";


        }


        finally {


            forgotPassword.style.pointerEvents =

                "auto";


        }


    }

);


</script>


</body>

</html>
