<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MK LABS | Reset Password</title>
<link rel="icon" type="image/png" href="../favicon.png">

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {

    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: 'Space Grotesk', sans-serif;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at top,
            #231942 0%,
            #090b18 45%,
            #04050c 100%
        );

    color: white;

}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size: 60px 60px;

    opacity: .12;

    pointer-events: none;

}

.reset-container {

    position: relative;

    width: min(92%, 450px);

    padding: 45px 38px;

    background: rgba(255, 255, 255, .07);

    border: 1px solid rgba(255, 255, 255, .15);

    border-radius: 25px;

    backdrop-filter: blur(25px);

    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 25px 80px rgba(0, 0, 0, .45);

    z-index: 2;

}

.logo {

    text-align: center;

    font-size: 30px;

    font-weight: 700;

    margin-bottom: 10px;

}

.logo span {

    color: #8B5CF6;

}

.subtitle {

    text-align: center;

    color: rgba(255, 255, 255, .6);

    margin-bottom: 35px;

    font-size: 15px;

}

h1 {

    text-align: center;

    font-size: 28px;

    margin-bottom: 30px;

}

label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    color: rgba(255, 255, 255, .75);

}

input {

    width: 100%;

    padding: 15px 16px;

    margin-bottom: 20px;

    border-radius: 12px;

    border: 1px solid rgba(255, 255, 255, .15);

    background: rgba(0, 0, 0, .25);

    color: white;

    outline: none;

    font-size: 15px;

}

input:focus {

    border-color: #8B5CF6;

    box-shadow:
        0 0 20px rgba(139, 92, 246, .2);

}

.reset-btn {

    width: 100%;

    padding: 15px;

    margin-top: 5px;

    border: none;

    border-radius: 50px;

    background: #8B5CF6;

    color: white;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

}

.reset-btn:hover {

    box-shadow:
        0 0 30px rgba(139, 92, 246, .5);

}

.reset-btn:disabled {

    opacity: .6;

    cursor: not-allowed;

}

#message {

    min-height: 24px;

    margin-top: 18px;

    text-align: center;

    font-size: 14px;

    color: rgba(255, 255, 255, .75);

}

.back-link {

    display: block;

    margin-top: 25px;

    text-align: center;

    color: rgba(255, 255, 255, .5);

    text-decoration: none;

    font-size: 14px;

}

.back-link:hover {

    color: #8B5CF6;

}

</style>

</head>

<body>

<div class="reset-container">

    <div class="logo">
        MK <span>LABS</span>
    </div>

    <p class="subtitle">
        Secure Developer Access
    </p>

    <h1>
        Set New Password
    </h1>

    <form id="resetForm">

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button
            type="submit"
            class="reset-btn"
            id="resetButton"
        >
            Update Password →
        </button>

        <div id="message"></div>

    </form>

    <a
        href="staff-login.html"
        class="back-link"
    >
        ← Back to Developer Access
    </a>

</div>


<script type="module">

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ==========================================
   SUPABASE
   ========================================== */

const SUPABASE_URL =
    "https://ffxubvsodumbicbkjbhu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Uh2voMc6uTYeCX_k0hD0Sw_AMj-rNSv";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==========================================
   ELEMENTS
   ========================================== */

const resetForm =
    document.getElementById("resetForm");

const resetButton =
    document.getElementById("resetButton");

const message =
    document.getElementById("message");


/* ==========================================
   CHECK RECOVERY SESSION
   ========================================== */

const {
    data: {
        session
    }
} = await supabase.auth.getSession();


if (!session) {

    message.textContent =
        "This password reset link is invalid or has expired.";

    resetButton.disabled = true;

}


/* ==========================================
   UPDATE PASSWORD
   ========================================== */

resetForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        return;

    }


    if (password.length < 8) {

        message.textContent =
            "Password must be at least 8 characters.";

        return;

    }


    resetButton.disabled = true;

    resetButton.textContent =
        "Updating...";

    message.textContent = "";


    try {

        const {
            error
        } = await supabase.auth.updateUser({

            password: password

        });


        if (error) {

            throw error;

        }


        message.textContent =
            "Password updated successfully.";

        resetButton.textContent =
            "Password Updated ✓";


        setTimeout(() => {

            window.location.href =
                "staff-login.html";

        }, 1500);


    } catch (error) {

        console.error(error);

        message.textContent =
            error.message ||
            "Unable to update password.";

        resetButton.disabled = false;

        resetButton.textContent =
            "Update Password →";

    }

});

</script>

</body>

</html>
